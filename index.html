<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy Pass Sign In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
    }

    .card {
      width: 330px;
      min-height: 390px;
      padding: 25px 14px;
      background: white;
      text-align: center;
      border: 1px solid #e5e5e5;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .custom-icon {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 auto 8px;
      font-size: 42px;
    }

    .ghost {
      position: absolute;
      left: 8px;
      top: 18px;
      z-index: 1;
    }

    .helmet {
      position: absolute;
      left: 18px;
      top: 0;
      z-index: 2;
      font-size: 27px;
      transform: rotate(-8deg);
    }

    .shield {
      position: absolute;
      right: 0;
      bottom: 2px;
      z-index: 3;
      font-size: 26px;
      transform: rotate(10deg);
    }

    h1 {
      max-width: 245px;
      margin: 0 auto 22px;
      font-size: 19px;
      line-height: 1.3;
    }

    .field {
      width: 100%;
      height: 42px;
      margin-bottom: 10px;
      padding: 0 12px;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      background: #f7f7f7;
      font-size: 13px;
    }

    .field:disabled {
      color: #999;
      cursor: not-allowed;
    }

    .forgot {
      display: block;
      margin: 4px 2px 20px;
      color: #777;
      font-size: 10px;
      text-align: right;
    }

    .login-button {
      width: 75px;
      height: 34px;
      border: 0;
      border-radius: 18px;
      background: #ffd43b;
      color: #222;
      font-size: 12px;
      font-weight: bold;
      cursor: not-allowed;
    }

    .signup {
      margin-top: 16px;
      font-size: 11px;
    }

    .signup a {
      color: #222;
      font-weight: bold;
      text-decoration: none;
    }

    .notice {
      max-width: 330px;
      margin-top: 18px;
      color: #777;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">

      <div class="custom-icon" aria-label="Ghost wearing a helmet and holding a shield">
        <span class="ghost">👻</span>
        <span class="helmet">🪖</span>
        <span class="shield">🛡️</span>
      </div>

      <h1>Sign in to claim your Buddy Pass</h1>

      <input
        class="field"
        type="text"
        placeholder="Login"
        disabled
      >

      <input
        class="field"
        type="password"
        placeholder="Password"
        disabled
      >

      <span class="forgot">Forgot password</span>

      <button class="login-button" disabled>
        Sign in
      </button>

    </section>

    <p class="signup">
      New here? <a href="#">Create an account</a>
    </p>

    <p class="notice">
      Please do not enter real login information.
    </p>
  </main>
</body>
</html>
