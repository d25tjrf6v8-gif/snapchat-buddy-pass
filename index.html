<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snapchat Login Mockup</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fffc00;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 35px 20px;
      background: #fffc00;
      color: white;
      font-size: 36px;
      font-weight: bold;
    }

    .notice {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      color: #333;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .notice h2 {
      margin-top: 0;
    }
  </style>
</head>

<body>
  <header>Snapchat Login</header>

  <div class="notice">
    <h2>Demo Mockup</h2>
    <p>This is a visual design demo and does not collect login information.</p>
  </div>
</body>
</html>
